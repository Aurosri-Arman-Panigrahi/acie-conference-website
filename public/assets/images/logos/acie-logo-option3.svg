<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="l3-loop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="l3-loop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="l3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(18, 16)" filter="url(#l3-shadow)">
    <!-- Infinity Ribbon Left Loop -->
    <path d="M 52,48 C 36,22 10,22 10,48 C 10,74 36,74 52,48 Z" fill="none" stroke="url(#l3-loop1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Infinity Ribbon Right Loop -->
    <path d="M 52,48 C 68,74 94,74 94,48 C 94,22 68,22 52,48 Z" fill="none" stroke="url(#l3-loop2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner Stylized Apex 'A' bridge -->
    <path d="M 36,62 L 52,28 L 68,62" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="52" x2="62" y2="52" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Ambient Data Particles -->
    <circle cx="52" cy="28" r="3.5" fill="#38BDF8" />
    <circle cx="22" cy="48" r="2.5" fill="#FFFFFF" />
    <circle cx="82" cy="48" r="2.5" fill="#FFFFFF" />
  </g>
  <!-- Text Brand -->
  <g transform="translate(132, 24)">
    <text x="0" y="42" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="44" fill="#0F172A" letter-spacing="-0.5">
      ACIE<tspan fill="#4F46E5">·27</tspan>
    </text>
    <rect x="0" y="52" width="285" height="2" fill="#E2E8F0" />
    <rect x="0" y="52" width="60" height="2" fill="#4F46E5" />
    <text x="0" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#1E293B" letter-spacing="1.6">
      COMPUTING, INTELLIGENCE &amp; ENGINEERING
    </text>
    <text x="0" y="87" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#64748B" letter-spacing="0.5">
      Indexed &amp; Peer-Reviewed International Journal &amp; Conference
    </text>
  </g>
</svg>