<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="l2-goldblue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="l2-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="l2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(18, 12)" filter="url(#l2-shadow)">
    <!-- Outer Gear Wheel Ring -->
    <circle cx="52" cy="52" r="44" fill="none" stroke="url(#l2-goldblue)" stroke-width="4.5" stroke-dasharray="14,4" />
    <!-- Middle Precision Ring -->
    <circle cx="52" cy="52" r="32" fill="none" stroke="#0284C7" stroke-width="2" />
    <!-- 8 Spokes representing Convergence -->
    <line x1="52" y1="12" x2="52" y2="92" stroke="#1E40AF" stroke-width="2.5" />
    <line x1="12" y1="52" x2="92" y2="52" stroke="#1E40AF" stroke-width="2.5" />
    <line x1="24" y1="24" x2="80" y2="80" stroke="#0284C7" stroke-width="2" stroke-dasharray="4,2" />
    <line x1="24" y1="80" x2="80" y2="24" stroke="#0284C7" stroke-width="2" stroke-dasharray="4,2" />
    <!-- Central Golden Core -->
    <circle cx="52" cy="52" r="14" fill="url(#l2-amber)" />
    <circle cx="52" cy="52" r="7" fill="#FFFFFF" />
    <!-- Surrounding Silicon Microchip pads -->
    <rect x="50" y="3" width="4" height="6" fill="#F59E0B" rx="1" />
    <rect x="50" y="95" width="4" height="6" fill="#F59E0B" rx="1" />
    <rect x="3" y="50" width="6" height="4" fill="#F59E0B" rx="1" />
    <rect x="95" y="50" width="6" height="4" fill="#F59E0B" rx="1" />
  </g>
  <!-- Text Brand -->
  <g transform="translate(132, 24)">
    <text x="0" y="42" font-family="'Cinzel', 'Trajan Pro', 'Inter', serif" font-weight="900" font-size="42" fill="#0F172A" letter-spacing="1">
      ACIE<tspan fill="#D97706" font-family="'Inter', sans-serif" font-weight="800">·2027</tspan>
    </text>
    <rect x="0" y="52" width="295" height="2" fill="#E2E8F0" />
    <rect x="0" y="52" width="65" height="2" fill="#D97706" />
    <text x="0" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#1E293B" letter-spacing="1.8">
      ADVANCES IN COMPUTING &amp; ENGINEERING
    </text>
    <text x="0" y="87" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#64748B" letter-spacing="0.5">
      Hosted at KIIT Deemed to be University, Bhubaneswar
    </text>
  </g>
</svg>