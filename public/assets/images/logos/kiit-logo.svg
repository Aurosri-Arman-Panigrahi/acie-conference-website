    <circle cx="50" cy="14" r="2.5" fill="#059669" />
  </g>
  <text x="120" y="46" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="36" fill="#047857" letter-spacing="1">
    KIIT <tspan font-size="20" font-weight="700" fill="#059669">UNIVERSITY</tspan>
  </text>
  <text x="120" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#065F46" letter-spacing="0.5">
    KALINGA INSTITUTE OF INDUSTRIAL TECHNOLOGY
  </text>
  <text x="120" y="88" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#64748B">
