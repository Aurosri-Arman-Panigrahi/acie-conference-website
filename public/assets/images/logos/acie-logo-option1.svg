<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <linearGradient id="l1-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="l1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="l1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E40AF" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(15, 12)" filter="url(#l1-shadow)">
    <!-- Hex Prism Top -->
    <polygon points="50,10 88,32 50,54 12,32" fill="url(#l1-primary)" opacity="0.95" />
    <!-- Hex Prism Left -->
    <polygon points="12,32 50,54 50,98 12,76" fill="#1E3A8A" opacity="0.9" />
    <!-- Hex Prism Right -->
    <polygon points="50,54 88,32 88,76 50,98" fill="#1D4ED8" />
    <!-- Quantum / Neural Node Connections -->
    <circle cx="50" cy="54" r="5.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="50" cy="10" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="88" cy="32" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="12" cy="32" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="50" cy="98" r="4.5" fill="#059669" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="12" cy="76" r="4.5" fill="#1E40AF" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="88" cy="76" r="4.5" fill="#1E40AF" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Pulse Synapse Rays -->
    <line x1="50" y1="54" x2="50" y2="10" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3,2" opacity="0.8" />
    <line x1="50" y1="54" x2="88" y2="32" stroke="#FFFFFF" stroke-width="1.8" opacity="0.8" />
    <line x1="50" y1="54" x2="12" y2="32" stroke="#FFFFFF" stroke-width="1.8" opacity="0.8" />
    <line x1="50" y1="54" x2="50" y2="98" stroke="#FFFFFF" stroke-width="2" opacity="0.85" />
  </g>
  <!-- Text Brand -->
  <g transform="translate(130, 24)">
    <text x="0" y="42" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="-1">
      ACIE<tspan fill="#2563EB">2027</tspan>
    </text>
    <rect x="0" y="52" width="280" height="2" fill="#E2E8F0" />
    <rect x="0" y="52" width="56" height="2" fill="#2563EB" />
    <text x="0" y="70" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#1E293B" letter-spacing="1.5">
      ADVANCES IN COMPUTING &amp; INTELLIGENCE
    </text>
    <text x="0" y="87" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="10.5" fill="#64748B" letter-spacing="0.5">
      An International Peer-Reviewed Open Access Conference
    </text>
  </g>
</svg>